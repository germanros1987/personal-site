name: Refresh Scholar publications

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_scholar.py
      - .github/workflows/update-scholar.yml

permissions:
  contents: write

concurrency:
  group: scholar-publications
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify parser and cache protection
        run: python -m unittest discover -s tests -p 'test_scholar.py'
      - name: Fetch latest ten publications
        run: python scripts/update_scholar.py
      - name: Save refreshed publications
        run: |
          if git diff --quiet -- _data/scholar_publications.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_publications.json
          git commit -m "Refresh latest Scholar publications"
          git push origin HEAD:main
