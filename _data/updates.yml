    text: 'Check out the results of the [CARLA Autonomous Driving Challenge 2024](https://opendrivelab.com/challenge2024/#carla), part of the Autonomous Grand Challenge at the CVPR 2024 Workshop on Foundation Models for Autonomous Systems.'
  - date: "2024-04-01"
    date_label: "1 Apr 2024"
    text: 'Our photorealistic [UrbanSyn dataset](https://www.urbansyn.org/) is now available on [Hugging Face](https://huggingface.co/datasets/UrbanSyn/UrbanSyn).'
  - date: "2024-03-16"
    date_label: "16 Mar 2024"
    text: 'Our new dataset on [3D object relighting](https://github.com/isl-org/objects-with-lighting) is out. Read the [paper](https://arxiv.org/abs/2401.09126).'

